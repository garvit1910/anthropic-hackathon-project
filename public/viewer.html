const INTRO_SEQ = [['vessel',0,1600],['aneurysm',1400,1200],['graph',2400,1050],['wss',3300,900],['stream',4000,1300],['brain',5400,2000,1]];
function runIntroReveal(){
  for (const [name, delay, dur, scaleFrom] of INTRO_SEQ){
    if (!groups[name].visible) continue;                 // respect layers that are toggled off
    beginReveal(name, { delay, dur, scaleFrom });
  }
}
// A layer checkbox (or an agent setLayer message) brings its metric to life, animated.
function onLayerToggle(id){
  if (GATED.has(id) && document.getElementById(id).checked && !sacDetected){   // gate: find the sac first, then show
    document.getElementById(id).checked = false;
    pendingAfterSac.push(() => _setLayer(id, true)); findAneurysmSac(); return;
  }
  const name = GROUP_OF[id]; if (!name) return;
  const on = document.getElementById(id).checked;
  if (on) beginReveal(name);
  else { _restoreReveal(name); groups[name].visible = false; }
  if (name === 'wss') hotspots.forEach(h => { h.el.style.display = on ? 'block' : 'none'; });
}
Object.keys(GROUP_OF).forEach(id =>
  document.getElementById(id).addEventListener('change', () => onLayerToggle(id)));

function applyWss(){
  if (document.getElementById('t-wss').checked && !sacDetected){    // gate: WSS heatmap needs the sac found first
    document.getElementById('t-wss').checked = false;
    pendingAfterSac.push(() => _setWss(true)); findAneurysmSac(); return;
  }
  const on = document.getElementById('t-wss').checked;
  aneurysmMeshes.forEach(m => { m.material = on ? m.userData.heat : m.userData.solid; });
  document.getElementById('wsslegend').style.display = on ? 'block' : 'none';
}
document.getElementById('t-wss').addEventListener('change', applyWss);

const sel = document.getElementById('caseSel');
CASES.forEach(c => { const o = document.createElement('option'); o.value=o.textContent=c; sel.appendChild(o); });
sel.addEventListener('change', () => loadCase(sel.value));
document.getElementById('resetBtn').onclick = () => loadCase(sel.value);
document.getElementById('findCathBtn').onclick = () => findCatheterRoute();
document.getElementById('findSacBtn').onclick = () => findAneurysmSac(true);   // button forces a replay
document.getElementById('spinBtn').onclick = () => {
  if (spinOut || manualSpin){ spinOut = false; manualSpin = false; }   // currently rotating (idle spin or manual) → stop
  else { manualSpin = true; }                                          // otherwise start manual auto-rotate
  applyAutoRotate();
};

addEventListener('resize', () => {
  camera.aspect = innerWidth/innerHeight; camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
  controls.handleResize();                          // TrackballControls caches the canvas rect
});
function animateFlow(){
  if (!flow.points || !groups.stream.visible) return;
  const dt = Math.min(clock.getDelta(), 0.05);
  const t = performance.now() * 0.001;
  const surge = Math.max(0, Math.sin(t * 2 * Math.PI * 1.1));   // ~1.1 Hz cardiac cycle
  const pulse = 0.5 + 0.85 * surge;                       // speed surge
  const br = 0.72 + 0.32 * surge;                         // brightness pump (systole = brighter), floor keeps flow visible in diastole
  const SPEED = 55;                                        // mm/s at normalized speed 1
  const posA = flow.geo.attributes.position.array, colA = flow.geo.attributes.color.array;
  for (let i=0;i<flow.states.length;i++){
    const st = flow.states[i], L = flow.lines[st.li];
    let j = 1; while (j < L.cum.length-1 && L.cum[j] < st.s) j++;
    const j0 = j-1, seg = Math.max(1e-6, L.cum[j]-L.cum[j0]);
    const f = Math.max(0, Math.min(1, (st.s - L.cum[j0]) / seg));
    const spd = L.spd[j0]*(1-f) + (L.spd[j]||0)*f;
    const P0 = L.P[j0], P1 = L.P[j];
    posA[3*i]   = P0[0]*(1-f)+P1[0]*f;
    posA[3*i+1] = P0[1]*(1-f)+P1[1]*f;
    posA[3*i+2] = P0[2]*(1-f)+P1[2]*f;
    const c = blood(spd / flow.vmax); colA[3*i]=c[0]*br; colA[3*i+1]=c[1]*br; colA[3*i+2]=c[2]*br;
    st.s += (0.08 + spd) * SPEED * pulse * dt;             // advance; slow floor so it never stalls
    if (st.s > L.total) st.s -= L.total;                  // loop
  }
  flow.geo.attributes.position.needsUpdate = true;
  flow.geo.attributes.color.needsUpdate = true;
}
const _v = new THREE.Vector3();
function updateLabels(){
  if (!groups.wss.visible || !hotspots.length) return;
  for (const hs of hotspots){
    _v.copy(hs.p).project(camera);
    const behind = _v.z > 1;
    hs.el.style.display = behind ? 'none' : 'block';
    if (behind) continue;
    hs.el.style.left = ((_v.x*0.5+0.5)*innerWidth) + 'px';
    hs.el.style.top  = ((-_v.y*0.5+0.5)*innerHeight) + 'px';
  }
}
function updateRouteLabels(){                         // project catheter hop pins / landing label to screen
  if (!routeLabels.length) return;
  const show = groups.cath.visible;
  for (const rl of routeLabels){
    if (!show){ rl.el.style.display = 'none'; continue; }
    _v.copy(rl.p).project(camera);
    if (_v.z > 1){ rl.el.style.display = 'none'; continue; }
    rl.el.style.display = 'block';
    rl.el.style.left = ((_v.x*0.5+0.5)*innerWidth) + 'px';
    rl.el.style.top  = ((-_v.y*0.5+0.5)*innerHeight) + 'px';
  }
}
(function tick(){ requestAnimationFrame(tick); animateFlow(); animateSearch(); animateSacDetect(); animateReveals(); animateHighlights(); stepCamera(); controls.update(); renderer.render(scene, camera); updateLabels(); updateRouteLabels(); updateSacCallout(); updateTip(); })();

// ── External control bridge (embedded in the NeuroVas console iframe) ──────────
// Rendering is untouched; this only adds a ?case= param + a postMessage API so the
// copilot can focus the sac / toggle WSS·flow·catheter layers and stay case-synced.
const _params = new URLSearchParams(location.search);
const _embed = _params.get('embed') === '1';
if (_embed) {
  const s = document.getElementById('status'); if (s) s.style.display = 'none';
  const h = document.getElementById('hint');   if (h) h.style.display = 'none';
}
// ── Control panel chrome: collapse toggle + drag-to-resize (persisted in embed) ─
(function panelChrome(){
  const panel = document.getElementById('panel');
  const grip = document.getElementById('panelGrip');
  const expandBtn = document.getElementById('panelExpand');
  const toggleBtn = document.getElementById('panelToggle');
  if (!panel || !grip || !expandBtn || !toggleBtn) return;
  const PW = 'neurovas.panelW', PC = 'neurovas.panelCollapsed';
  function setCollapsed(on){
    panel.classList.toggle('collapsed', on);
    expandBtn.style.display = on ? 'flex' : 'none';
    try { if (_embed) localStorage.setItem(PC, on ? '1' : '0'); } catch(_){}
  }
  toggleBtn.onclick = () => setCollapsed(true);
  expandBtn.onclick = () => setCollapsed(false);
  grip.addEventListener('pointerdown', (e) => {
    e.preventDefault(); grip.setPointerCapture(e.pointerId);
    const left = panel.getBoundingClientRect().left;
    const onMove = (ev) => { panel.style.width = Math.min(460, Math.max(240, ev.clientX - left)) + 'px'; };
    const onUp = () => {
      grip.removeEventListener('pointermove', onMove);
      grip.removeEventListener('pointerup', onUp);
      try { if (_embed) localStorage.setItem(PW, parseInt(panel.style.width) || 288); } catch(_){}
    };
    grip.addEventListener('pointermove', onMove);
    grip.addEventListener('pointerup', onUp);
  });
  if (_embed){
    try {
      const w = parseInt(localStorage.getItem(PW));
      if (w) panel.style.width = Math.min(460, Math.max(240, w)) + 'px';
      if (localStorage.getItem(PC) === '1') setCollapsed(true);
    } catch(_){}
  }
})();
function _setLayer(id, on){
  // catheter is no longer a checkbox — legacy setLayer(t-cath) maps to the animated search
  if (id === 't-cath'){ if (on) findCatheterRoute(); else { clear(groups.search); clear(groups.cath); clearRouteLabels(); hideRoadmap(); search = null; resetCathUI(); } return; }
  if (GATED.has(id) && on && !sacDetected){ pendingAfterSac.push(() => _setLayer(id, true)); findAneurysmSac(); return; }  // detect first, then show
  const el = document.getElementById(id); if (el){ el.checked = !!on; onLayerToggle(id); }   // animate the reveal, like a click
}
function _setWss(on){
  if (on && !sacDetected){ pendingAfterSac.push(() => _setWss(true)); findAneurysmSac(); return; }   // detect first, then show
  const el = document.getElementById('t-wss'); if (el){ el.checked = !!on; applyWss(); }
}
window.addEventListener('message', (e) => {
  const m = e.data || {};
  if (m.type === 'setCase' && m.case) { sel.value = m.case; loadCase(m.case); }
  else if (m.type === 'focusAneurysm') focusAneurysm();
  else if (m.type === 'findSac') findAneurysmSac();
  else if (m.type === 'findCatheter') findCatheterRoute();
  else if (m.type === 'setThinking'){ thinking = !!m.on; if (thinking){ spinOut = false; focusK = 1.5; } else if (!spinOut){ focusCenter = null; } applyAutoRotate(); }
  else if (m.type === 'settle'){ flyOutSpin(); }
  else if (m.type === 'setLayer') _setLayer(m.id, m.on);
  else if (m.type === 'setWss') _setWss(m.on);
  else if (m.type === 'highlight') highlightIds(m.elementIds);   // agent named-element flash (camera stays the director's job)
  else if (m.type === 'highlightEvidence') _highlightEvidence(m.topic);
  else if (m.type === 'reset') loadCase(sel.value);
});
// Map an evidence-graph node's topic to a geometry emphasis, reusing existing actions.
function _highlightEvidence(topic){
  const t = String(topic || '').toLowerCase();
  if (t === 'wss' || t.includes('hemodynam')) { _setWss(true); focusAneurysm(); }
  else if (t === 'access' || t === 'treatment' || t === 'endovascular') { findCatheterRoute(); }
  else focusAneurysm(); // size / aspect_ratio / morphology / location / natural-history / …
}
// Tell the parent when the user switches case via the panel, so the copilot re-targets.
sel.addEventListener('change', () => { try { parent.postMessage({ type: 'caseChanged', case: sel.value }, '*'); } catch (_) {} });

const _initialCase = CASES.includes(_params.get('case')) ? _params.get('case') : 'HERO_sub013';
sel.value = _initialCase;
loadCase(_initialCase);
try { parent.postMessage({ type: 'ready', case: _initialCase }, '*'); } catch (_) {}
